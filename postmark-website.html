function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function partsFromISO(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function dayName(iso) { try { return partsFromISO(iso).toLocaleDateString("en-US", { weekday: "long" }); } catch { return ""; } }
function formatLong(iso) { try { return partsFromISO(iso).toLocaleDateString("en-US", { day: "numeric", month: "long", year: "numeric" }); } catch { return iso; } }
function formatShort(iso) { try { return partsFromISO(iso).toLocaleDateString("en-US", { day: "numeric", month: "short" }); } catch { return iso; } }

function moodColor(mood, C) {
  const m = (mood || "").toLowerCase();
  if (/(happy|joy|excite|grateful|proud|content|hopeful)/.test(m)) return C.accent;
  if (/(calm|peace|relax|settled)/.test(m)) return C.good;
  if (/(sad|lonely|down|tired|low|drained)/.test(m)) return C.accent2;
  if (/(angry|stress|anxi|frustrat|overwhelm)/.test(m)) return C.warn;
  return C.textDim;
}

const CATEGORIES = {
  "Relationships": "❤️", "Studies": "🎓", "Career": "💼", "Personal Growth": "🌱",
  "Thoughts & Emotions": "🧠", "Goals": "🎯", "Family": "👨‍👩‍👧", "Friends": "🧑‍🤝‍🧑",
  "Learning": "📚", "Money": "💰", "Travel": "✈️", "Habits": "🔥", "Ideas": "💡", "Identity": "🪞",
};

function computeStreak(entries) {
  const dateSet = new Set(entries.map((e) => e.date));
  let streak = 0;
  const cursor = new Date();
  while (true) {
    const iso = `${cursor.getFullYear()}-${String(cursor.getMonth() + 1).padStart(2, "0")}-${String(cursor.getDate()).padStart(2, "0")}`;
    if (dateSet.has(iso)) { streak++; cursor.setDate(cursor.getDate() - 1); } else break;
  }
  return streak;
}

async function askClaude(prompt) {
  // Goes through our own Netlify function (netlify/functions/claude.js) so the
  // Anthropic API key stays on the server and is never exposed in browser JS.
  try {
    const res = await fetch("/.netlify/functions/claude", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt }),
    });
    const data = await res.json();
    return data.text || "";
  } catch { return ""; }
}
function stripFence(s) { return s.replace(/```json|```/g, "").trim(); }

    <div style={{ background: C.bg, color: C.text }} className="fixed inset-0 z-50 flex flex-col items-center justify-center">

        @keyframes riseFade { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
        .splash-seal { animation: seal 1.1s cubic-bezier(.2,.8,.2,1) both; }
        .splash-word { animation: riseFade 0.8s ease 0.9s both; }
      `}</style>
      <div
        className="splash-seal"

}

function PostmarkApp({ uid, db, userEmail, onLogout }) {
  const [showSplash, setShowSplash] = useState(true);
  const [loaded, setLoaded] = useState(false);
  const [entries, setEntries] = useState([]);
  const [capsules, setCapsules] = useState([]);
  const [themeId, setThemeId] = useState("pink");
  const [capsuleBg, setCapsuleBg] = useState("dusk");
  const [keepUnlockedCapsules, setKeepUnlockedCapsules] = useState(true);
  const [tab, setTab] = useState("home");
  const [toast, setToast] = useState(null);
  const C = THEMES[themeId];

  // All data for this account lives in one Firestore doc: users/{uid}
  const userDocRef = useMemo(() => db.collection("users").doc(uid), [db, uid]);

  useEffect(() => {
    (async () => {
      try {
        const snap = await userDocRef.get();
        if (snap.exists) {
          const data = snap.data();
          if (Array.isArray(data.entries)) setEntries(data.entries);
          if (Array.isArray(data.capsules)) setCapsules(data.capsules);
          if (data.settings) {
            const s = data.settings;
            if (s.themeId) setThemeId(s.themeId);
            if (s.capsuleBg) setCapsuleBg(s.capsuleBg);
            if (typeof s.keepUnlockedCapsules === "boolean") setKeepUnlockedCapsules(s.keepUnlockedCapsules);
          }
        }
      } catch (e) { setToast("Couldn't load your saved data — check your connection."); }
      setLoaded(true);
    })();
  }, [userDocRef]);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 3600);
    return () => clearTimeout(t);
  }, [toast]);

  async function persistEntries(next) {
    setEntries(next);
    try { await userDocRef.set({ entries: next }, { merge: true }); }
    catch { setToast("Saved on screen, but couldn't sync to your account."); }
  }
  async function persistCapsules(next) {
    setCapsules(next);
    try { await userDocRef.set({ capsules: next }, { merge: true }); } catch {}
  }
  async function persistSettings(next) {
    try { await userDocRef.set({ settings: next }, { merge: true }); } catch {}
  }

  function updateTheme(id) {
    setThemeId(id);
    persistSettings({ themeId: id, capsuleBg, keepUnlockedCapsules });
  }
  function updateCapsuleBg(id) {
    setCapsuleBg(id);
    persistSettings({ themeId, capsuleBg: id, keepUnlockedCapsules });
  }
  function updateKeepUnlocked(val) {
    setKeepUnlockedCapsules(val);
    persistSettings({ themeId, capsuleBg, keepUnlockedCapsules: val });
  }

  async function seedSampleEntries() {
    const seeded = SAMPLE_ENTRIES.map((s, i) => ({
      id: `sample-${Date.now()}-${i}`, date: s.date, day: dayName(s.date), type: "text", text: s.text,
      audioData: null, mood: s.mood, moodScore: s.score, moodEmoji: s.emoji, reflection: s.reflection,
      categories: s.categories || [], createdAt: partsFromISO(s.date).getTime() + i,
    }));
    const combined = [...entries, ...seeded].sort((a, b) => b.createdAt - a.createdAt);
    await persistEntries(combined);
    setToast("Loaded 4 sample entries to try every feature.");
  }
  async function deleteEntry(id) { await persistEntries(entries.filter((e) => e.id !== id)); }

  const avgScore = entries.length ? (entries.reduce((s, e) => s + (e.moodScore || 0), 0) / entries.length).toFixed(1) : "—";
  const streak = computeStreak(entries);

  const TABS = [
    { id: "home", label: "Home", icon: PenLine },
    { id: "processing", label: "Processing", icon: Brain },
    { id: "play", label: "Play", icon: PlayIcon },
    { id: "capsule", label: "Capsule", icon: Clock },
    { id: "settings", label: "Settings", icon: SettingsIcon },
  ];

  return (
    <div style={{ background: C.bg, minHeight: "100%", color: C.text, fontFamily: fonts.body }} className="w-full min-h-screen pb-24 relative">
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Quicksand:wght@400;500;600;700&family=Caveat:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');`}</style>

      {showSplash && <Splash C={C} onDone={() => setShowSplash(false)} />}

      {!showSplash && (
        <div className="max-w-xl mx-auto px-4 pt-7">
          {!loaded ? (
            <div className="flex items-center gap-2 text-sm" style={{ color: C.textDim }}>
              <Loader2 size={16} className="animate-spin" /> Opening your diary…
            </div>
          ) : (
            <>
              {tab === "home" && (
                <HomeTab C={C} entries={entries} persistEntries={persistEntries} setToast={setToast}
                  seedSampleEntries={seedSampleEntries} deleteEntry={deleteEntry} avgScore={avgScore} streak={streak} />
              )}
              {tab === "processing" && <ProcessingTab C={C} entries={entries} setToast={setToast} avgScore={avgScore} streak={streak} />}
              {tab === "play" && <PlayTab C={C} entries={entries} setToast={setToast} />}
              {tab === "capsule" && (
                <CapsuleTab C={C} capsules={capsules} persistCapsules={persistCapsules} setToast={setToast}
                  bgId={capsuleBg} keepUnlocked={keepUnlockedCapsules} />
              )}
              {tab === "settings" && (
                <SettingsTab C={C} themeId={themeId} onTheme={updateTheme} capsuleBg={capsuleBg} onCapsuleBg={updateCapsuleBg}
                  keepUnlocked={keepUnlockedCapsules} onKeepUnlocked={updateKeepUnlocked} userEmail={userEmail} onLogout={onLogout} db={db} uid={uid} />
              )}
            </>
          )}
        </div>
      )}

      {!showSplash && (
        <div style={{ background: C.panel, borderTop: `1px solid ${C.line}` }} className="fixed bottom-0 left-0 right-0 z-10">
          <div className="max-w-xl mx-auto flex justify-around px-1 py-1.5">
            {TABS.map((g) => {
              const Icon = g.icon;
              const active = tab === g.id;
              return (
                <button key={g.id} onClick={() => setTab(g.id)} className="flex flex-col items-center gap-0.5 px-2.5 py-1.5 rounded-xl flex-1 transition-colors" style={{ color: active ? C.accent : C.textDim }}>
                  <div style={{ background: active ? `${C.accent}22` : "transparent" }} className="rounded-lg px-3 py-1">
                    <Icon size={18} />
                  </div>
                  <span className="text-[10px] font-medium">{g.label}</span>

      {toast && (
        <div style={{ background: C.chip, border: `1px solid ${C.line}`, color: C.text }} className="fixed bottom-20 left-1/2 -translate-x-1/2 px-4 py-2.5 rounded-full text-sm shadow-lg flex items-center gap-2 max-w-[90%] z-20">
          {toast}
          <button onClick={() => setToast(null)}><X size={13} /></button>
        </div>
      )}
    </div>
  );
}

function HomeTab({ C, entries, persistEntries, setToast, seedSampleEntries, deleteEntry, avgScore, streak }) {
  const [entryType, setEntryType] = useState("text");
  const [entryDate] = useState(todayISO());
  const [entryText, setEntryText] = useState("");
  const [caption, setCaption] = useState("");
  const [recording, setRecording] = useState(false);
  const [audioData, setAudioData] = useState(null);
  const [audioUrl, setAudioUrl] = useState(null);
  const [videoUrl, setVideoUrl] = useState(null);
  const [saving, setSaving] = useState(false);
  const [affirmation, setAffirmation] = useState("");
  const [affirmationLoading, setAffirmationLoading] = useState(false);
  const mediaRecorderRef = useRef(null);
  const chunksRef = useRef([]);

  async function analyzeMood(text) {
    const raw = await askClaude(
      `You are a gentle mood-reading assistant inside a personal diary app. Read this diary entry and respond with ONLY raw JSON, no markdown fences:
{"mood": "<one word>", "score": <integer 1-10>, "emoji": "<single emoji>", "reflection": "<one warm, non-clinical sentence under 20 words>", "categories": [<1-3 items from exactly this list: ${Object.keys(CATEGORIES).map((c) => `"${c}"`).join(", ")}>]}

Diary entry:
"""${text}"""`
    );
    try { return JSON.parse(stripFence(raw)); } catch { return null; }
  }

  function resetForm() { setEntryText(""); setCaption(""); setAudioData(null); setAudioUrl(null); setVideoUrl(null); }

  async function startRecording(kind) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: kind === "video" });
      chunksRef.current = [];
      const recorder = new MediaRecorder(stream);
      recorder.ondataavailable = (e) => { if (e.data.size > 0) chunksRef.current.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunksRef.current, { type: kind === "video" ? "video/webm" : "audio/webm" });
        stream.getTracks().forEach((t) => t.stop());
        if (kind === "video") { setVideoUrl(URL.createObjectURL(blob)); }
        else {
          setAudioUrl(URL.createObjectURL(blob));
          const reader = new FileReader();
          reader.onloadend = () => {
            const b64 = reader.result;
            if (b64.length > 3.5 * 1024 * 1024) setToast("That clip's a bit long to save — try under ~30 seconds.");
            else setAudioData(b64);
          };
          reader.readAsDataURL(blob);
        }
      };
      recorder.start();
      mediaRecorderRef.current = recorder;
      setRecording(true);
    } catch { setToast(`Couldn't reach your ${kind === "video" ? "camera" : "microphone"} — check browser permissions.`); }
  }
  function stopRecording() { mediaRecorderRef.current?.stop(); setRecording(false); }

  async function saveEntry() {
    const content = entryType === "text" ? entryText.trim() : caption.trim();
    if (!content) { setToast(entryType === "text" ? "Write something first." : "Add a quick caption — the mood reader needs a little text."); return; }
    setSaving(true);
    const mood = await analyzeMood(content);
    const entry = {
      id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`, date: entryDate, day: dayName(entryDate), type: entryType, text: content,
      audioData: entryType === "voice" ? audioData : null, hasVideo: entryType === "video" && !!videoUrl,
      mood: mood?.mood || "Unrated", moodScore: typeof mood?.score === "number" ? mood.score : 5, moodEmoji: mood?.emoji || "📝",
      reflection: mood?.reflection || "", categories: Array.isArray(mood?.categories) ? mood.categories.filter((c) => CATEGORIES[c]) : [],
      createdAt: Date.now(),
    };
    await persistEntries([entry, ...entries]);
    resetForm(); setSaving(false);
    setToast(`Sealed — ${entry.day}, ${formatLong(entry.date)}.`);
  }

  async function generateAffirmation() {
    setAffirmationLoading(true); setAffirmation("");
    const recent = entries.slice(0, 8);
    const material = recent.length ? recent.map((e) => `[${formatLong(e.date)}] mood: ${e.mood}: ${e.text}`).join("\n") : "No entries yet.";
    const text = await askClaude(`Write one short, specific, grounded affirmation (1-2 sentences, under 35 words), no clichés, grounded in something real from these entries if available:\n${material}`);
    setAffirmation(text || "Keep going — one honest day at a time.");
    setAffirmationLoading(false);
  }

  const recentEntries = entries.slice(0, 6);

  return (
    <div>
      <div className="flex items-center justify-between mb-1">
        <h1 style={{ fontFamily: fonts.display, fontStyle: "italic", fontWeight: 600, color: C.accent }} className="text-3xl">Postmark</h1>
        <span style={{ color: C.textDim, fontFamily: fonts.mono }} className="text-xs">{dayName(todayISO())}</span>
      </div>
      <p style={{ color: C.accent2, fontFamily: fonts.script }} className="text-xl mb-5 -mt-1">Every day, sealed and kept. ✿</p>

      <div className="grid grid-cols-3 gap-2 mb-5">
        <StatCard label="Entries" value={entries.length} C={C} />
        <StatCard label="Avg mood" value={`${avgScore}/10`} C={C} />
        <StatCard label="Streak" value={`${streak}d`} C={C} />
      </div>

      {/* Hero write box */}
      <div style={{ background: C.panel, border: `1px solid ${C.line}` }} className="rounded-2xl p-5 mb-5">
        <p style={{ fontFamily: fonts.display, fontWeight: 600 }} className="text-lg mb-3">Tell me what's on your mind</p>

        <div className="flex gap-2 mb-3">
          {[["text", PenLine, "Text"], ["voice", Mic, "Voice"], ["video", Video, "Video"]].map(([id, Icon, label]) => (
            <button key={id} onClick={() => { setEntryType(id); resetForm(); }} className="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm"
              style={{ background: entryType === id ? C.accent : C.panel2, color: entryType === id ? C.surfaceOnAccent : C.text, border: `1px solid ${entryType === id ? C.accent : C.line}` }}>
              <Icon size={14} /> {label}
            </button>
          ))}
        </div>

        {entryType === "text" && (
          <textarea value={entryText} onChange={(e) => setEntryText(e.target.value)} placeholder="What happened today? How are you, really?" rows={6}
            style={{ background: C.panel2, color: C.text }} className="w-full rounded-xl p-4 text-sm leading-relaxed outline-none resize-none" />
        )}
        {entryType === "voice" && (
          <div>
            <div className="flex items-center gap-3 mb-3">
              {!recording ? (
                <button onClick={() => startRecording("audio")} style={{ background: C.warn, color: "#fff" }} className="flex items-center gap-2 px-4 py-2 rounded-full text-sm"><Mic size={15} /> Record</button>
              ) : (
                <button onClick={stopRecording} style={{ background: C.accent2, color: "#fff" }} className="flex items-center gap-2 px-4 py-2 rounded-full text-sm animate-pulse"><Square size={13} /> Stop</button>
              )}
              {audioUrl && <audio controls src={audioUrl} style={{ height: 32 }} />}
            </div>
            <textarea value={caption} onChange={(e) => setCaption(e.target.value)} placeholder="One or two lines about what you just said…" rows={3}
              style={{ background: C.panel2, color: C.text }} className="w-full rounded-lg p-3 text-sm outline-none resize-none" />
          </div>
        )}
        {entryType === "video" && (
          <div>
            <div className="flex items-center gap-3 mb-3">
              {!recording ? (
                <button onClick={() => startRecording("video")} style={{ background: C.warn, color: "#fff" }} className="flex items-center gap-2 px-4 py-2 rounded-full text-sm"><Video size={15} /> Record</button>
              ) : (
                <button onClick={stopRecording} style={{ background: C.accent2, color: "#fff" }} className="flex items-center gap-2 px-4 py-2 rounded-full text-sm animate-pulse"><Square size={13} /> Stop</button>
              )}
            </div>
            {videoUrl && <video controls src={videoUrl} className="w-full rounded-lg mb-3" style={{ maxHeight: 200 }} />}
            <textarea value={caption} onChange={(e) => setCaption(e.target.value)} placeholder="One or two lines about this moment…" rows={3}
              style={{ background: C.panel2, color: C.text }} className="w-full rounded-lg p-3 text-sm outline-none resize-none" />
          </div>
        )}

        <button onClick={saveEntry} disabled={saving} style={{ background: C.accent, color: C.surfaceOnAccent }} className="mt-4 w-full flex items-center justify-center gap-2 py-3 rounded-xl text-sm font-medium disabled:opacity-60">
          {saving ? <><Loader2 size={15} className="animate-spin" /> Reading the mood, sealing entry…</> : "Seal today's entry"}
        </button>
        <button onClick={seedSampleEntries} style={{ color: C.textDim }} className="w-full text-center text-xs mt-3 flex items-center justify-center gap-1.5">
          <Sparkles size={12} /> Load 4 sample entries to try every feature
        </button>
      </div>

      {/* Daily affirmation */}
      <div style={{ background: C.panel, border: `1px solid ${C.line}` }} className="rounded-2xl p-4 mb-5">
        <div className="flex items-center justify-between mb-2">
          <p style={{ color: C.textDim }} className="text-xs">Today's affirmation</p>
          <button onClick={generateAffirmation} disabled={affirmationLoading} style={{ color: C.accent }} className="text-xs flex items-center gap-1 disabled:opacity-60">
            {affirmationLoading ? <Loader2 size={12} className="animate-spin" /> : <Sparkles size={12} />} New
          </button>
        </div>
        {affirmation ? (
          <p style={{ fontFamily: fonts.display }} className="text-sm">{affirmation}</p>
        ) : (
          <p style={{ color: C.textDim }} className="text-sm">Tap "New" for something honest, grounded in your own days.</p>
        )}
      </div>

      {/* Recent timeline */}
      <div className="flex items-center justify-between mb-3">
        <p style={{ fontFamily: fonts.display, fontWeight: 600 }} className="text-base">Recent entries</p>
        <Clock size={14} color={C.textDim} />
      </div>
      <div className="space-y-3">
        {recentEntries.length === 0 ? (
          <EmptyState C={C} text="Nothing kept yet. Write your first entry above and it'll show up here." />
        ) : (
          recentEntries.map((e) => (
            <div key={e.id} style={{ background: C.panel, border: `1px solid ${C.line}` }} className="rounded-xl p-4 flex gap-3">
              <PostmarkBadge date={e.date} size="sm" C={C} />
              <div className="flex-1 min-w-0">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2 text-sm">
                    <span>{e.moodEmoji}</span>
                    <span style={{ color: moodColor(e.mood, C) }} className="font-medium">{e.mood}</span>
                    <span style={{ color: C.textDim }} className="text-xs uppercase tracking-wide">{e.type}</span>
                  </div>
                  <button onClick={() => deleteEntry(e.id)} style={{ color: C.textDim }}><Trash2 size={14} /></button>
                </div>
                <p className="text-sm mt-1.5 leading-relaxed">{e.text}</p>
                {(e.categories || []).length > 0 && (
                  <div className="flex flex-wrap gap-1 mt-2">
                    {e.categories.map((c) => (<span key={c} style={{ background: C.chip, color: C.textDim }} className="text-[10px] px-2 py-0.5 rounded-full">{CATEGORIES[c]} {c}</span>))}
                  </div>
                )}
                {e.audioData && <audio controls src={e.audioData} className="mt-2" style={{ height: 30, width: "100%" }} />}
                {e.reflection && <p style={{ color: C.textDim }} className="text-xs mt-2 italic">"{e.reflection}"</p>}
              </div>
            </div>
          ))
        )}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------- */
/* PROCESSING (ME) — mood chart + insights/patterns/contradictions/  */
/* beliefs/weekly, all reused from your original ME dashboard        */
/* ---------------------------------------------------------------- */

function ProcessingTab({ C, entries, setToast, avgScore, streak }) {
  const [sub, setSub] = useState("overview");
  const [meInsights, setMeInsights] = useState([]);
  const [meLoading, setMeLoading] = useState(false);
  const [checkin, setCheckin] = useState("");
  const [checkinLoading, setCheckinLoading] = useState(false);
  const [patterns, setPatterns] = useState([]);
  const [patternsLoading, setPatternsLoading] = useState(false);
  const [expandedPattern, setExpandedPattern] = useState(null);
  const [patternFeedback, setPatternFeedback] = useState({});
  const [contradictions, setContradictions] = useState([]);
  const [contradictionsLoading, setContradictionsLoading] = useState(false);
  const [contradictionFeedback, setContradictionFeedback] = useState({});
  const [beliefsValues, setBeliefsValues] = useState(null);
  const [beliefsLoading, setBeliefsLoading] = useState(false);
  const [weekly, setWeekly] = useState(null);
  const [weeklyLoading, setWeeklyLoading] = useState(false);

  const categoryCounts = entries.reduce((acc, e) => { (e.categories || []).forEach((c) => { acc[c] = (acc[c] || 0) + 1; }); return acc; }, {});
  const topCategories = Object.entries(categoryCounts).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const chartData = [...entries].sort((a, b) => a.createdAt - b.createdAt).map((e) => ({ label: formatShort(e.date), score: e.moodScore }));

  async function generateMeInsights() {
    if (entries.length < 2) { setToast("A couple more entries first."); return; }
    setMeLoading(true); setMeInsights([]);
    const material = entries.map((e) => `${formatLong(e.date)} — mood: ${e.mood}: ${e.text}`).join("\n");
    const raw = await askClaude(`Read these diary entries and identify what they suggest about the writer. Respond with ONLY raw JSON:
{"insights": ["<observation, phrased as 'You seem to...', under 25 words, never a diagnosis>"]}
Give 3-4 insights, grounded only in the entries.\n\n${material}`);
    try { const parsed = JSON.parse(stripFence(raw)); setMeInsights(Array.isArray(parsed.insights) ? parsed.insights : []); }
    catch { setToast("Couldn't generate insights — try again."); }
    setMeLoading(false);
  }
  async function generateCheckin() {
    if (entries.length === 0) { setToast("Write a few entries first."); return; }
    setCheckinLoading(true); setCheckin("");
    const recent = entries.slice(0, 14);
    const material = recent.map((e) => `${formatLong(e.date)} — mood: ${e.mood} (${e.moodScore}/10): ${e.text}`).join("\n");
    const text = await askClaude(`You are a thoughtful companion reading recent diary entries. Notice gentle patterns without diagnosing. Write a short (120-160 word) reflective check-in, second person. If entries suggest ongoing heaviness, gently suggest talking to someone trusted or a professional.\n\n${material}`);
    setCheckin(text || "Couldn't put this together — try again.");
    setCheckinLoading(false);
  }
  async function generatePatterns() {
    if (entries.length < 2) { setToast("A couple more entries first."); return; }
    setPatternsLoading(true); setPatterns([]); setPatternFeedback({}); setExpandedPattern(null);
    const material = entries.map((e) => `[${formatLong(e.date)}] mood: ${e.mood}: ${e.text}`).join("\n");
    const raw = await askClaude(`Find genuine recurring patterns. Respond with ONLY raw JSON:
{"patterns": [{"pattern": "<phrased 'You seem to...', under 22 words>", "confidence": "Low|Medium|High", "evidenceDates": ["<exact dates from entries>"]}]}
Only include if 2+ entries support it. Return 1-3, or empty array if not enough repetition.\n\n${material}`);
    try {
      const parsed = JSON.parse(stripFence(raw));
      const list = Array.isArray(parsed.patterns) ? parsed.patterns : [];
      const withEvidence = list.map((p) => ({ ...p, evidence: (p.evidenceDates || []).map((d) => entries.find((e) => formatLong(e.date) === d)).filter(Boolean) }));
      setPatterns(withEvidence);
      if (withEvidence.length === 0) setToast("Not enough repetition yet — keep writing.");
    } catch { setToast("Couldn't find patterns — try again."); }
    setPatternsLoading(false);
  }
  async function generateContradictions() {
    if (entries.length < 3) { setToast("A few more entries first."); return; }
    setContradictionsLoading(true); setContradictions([]); setContradictionFeedback({});
    const material = entries.map((e) => `[${formatLong(e.date)}]: ${e.text}`).join("\n");
    const raw = await askClaude(`Look for genuine tensions across these entries. Respond with ONLY raw JSON:
{"contradictions": [{"tension": "<gentle, under 25 words>", "dateA": "<date>", "snippetA": "<under 15 words>", "dateB": "<date>", "snippetB": "<under 15 words>"}]}
Return 0-2 real items.\n\n${material}`);
    try {
      const parsed = JSON.parse(stripFence(raw));
      const list = Array.isArray(parsed.contradictions) ? parsed.contradictions : [];
      setContradictions(list);
      if (list.length === 0) setToast("Nothing that looks like a real tension yet.");
    } catch { setToast("Couldn't check contradictions — try again."); }
    setContradictionsLoading(false);
  }
  async function generateBeliefsValues() {
    if (entries.length < 2) { setToast("A couple more entries first."); return; }
    setBeliefsLoading(true); setBeliefsValues(null);
    const material = entries.map((e) => `[${formatLong(e.date)}]: ${e.text}`).join("\n");
    const raw = await askClaude(`Extract beliefs and values from these entries. Respond with ONLY raw JSON:
{"beliefs": [{"belief": "<in their voice, under 18 words>", "timesSeen": <integer>}], "values": ["<value word>"]}
Only genuinely grounded ones. Up to 4 beliefs, up to 6 values.\n\n${material}`);
    try { setBeliefsValues(JSON.parse(stripFence(raw))); } catch { setToast("Couldn't extract this time — try again."); }
    setBeliefsLoading(false);
  }
  async function generateWeekly() {
    const cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;
    const recent = entries.filter((e) => e.createdAt >= cutoff);
    if (recent.length === 0) { setToast("No entries from the last 7 days yet."); return; }
    setWeeklyLoading(true); setWeekly(null);
    const material = recent.map((e) => `${e.day}, ${formatLong(e.date)} — mood: ${e.mood}: ${e.text}`).join("\n");
    const raw = await askClaude(`Summarize this week from diary entries. Respond with ONLY raw JSON:
{"whatHappened": "<2-3 sentences>", "feelings": "<2-3 sentences, non-clinical>", "patterns": "<1-2 sentences, or note if nothing repeated>", "question": "<one thoughtful reflection question>"}\n\n${material}`);
    try { setWeekly(JSON.parse(stripFence(raw))); } catch { setToast("Couldn't put the week together — try again."); }
    setWeeklyLoading(false);
  }

  const SUBS = [["overview", "Overview"], ["patterns", "Patterns"], ["contradictions", "Tensions"], ["beliefs", "Beliefs"], ["weekly", "Your Week"]];

  return (
    <div>
      <p style={{ fontFamily: fonts.display, fontWeight: 600 }} className="text-2xl mb-4">Processing</p>
      <div className="flex gap-2 mb-5 overflow-x-auto pb-1">
        {SUBS.map(([id, label]) => (
          <button key={id} onClick={() => setSub(id)} className="px-3 py-1.5 rounded-full text-xs whitespace-nowrap"
            style={{ background: sub === id ? C.accent : C.panel, color: sub === id ? C.surfaceOnAccent : C.textDim, border: `1px solid ${sub === id ? C.accent : C.line}` }}>{label}</button>
        ))}
      </div>

      {entries.length === 0 && <EmptyState C={C} text="Processing reads your own entries to notice themes — write a few first, or load sample entries from Home." />}

      {entries.length > 0 && sub === "overview" && (
        <div>
          <div className="grid grid-cols-3 gap-2 mb-4">
            <StatCard label="Entries" value={entries.length} C={C} />
            <StatCard label="Avg mood" value={`${avgScore}/10`} C={C} />
            <StatCard label="Streak" value={`${streak}d`} C={C} />
          </div>
          <div style={{ background: C.panel, border: `1px solid ${C.line}` }} className="rounded-xl p-4 mb-4">
            <p style={{ color: C.textDim }} className="text-xs mb-2">Mood over time</p>
            <div style={{ width: "100%", height: 170 }}>
              <ResponsiveContainer>
                <LineChart data={chartData}>
                  <CartesianGrid stroke={C.line} strokeDasharray="3 3" />
                  <XAxis dataKey="label" stroke={C.textDim} tick={{ fontSize: 10 }} />
                  <YAxis domain={[0, 10]} stroke={C.textDim} tick={{ fontSize: 10 }} width={24} />
                  <Tooltip contentStyle={{ background: C.chip, border: `1px solid ${C.line}`, fontSize: 12 }} />
                  <Line type="monotone" dataKey="score" stroke={C.accent} strokeWidth={2} dot={{ r: 3, fill: C.accent }} />
                </LineChart>
              </ResponsiveContainer>
            </div>
          </div>
          {topCategories.length > 0 && (
            <div style={{ background: C.panel, border: `1px solid ${C.line}` }} className="rounded-xl p-4 mb-4">
              <p style={{ color: C.textDim }} className="text-xs mb-3">What's occupied your mind</p>
              <div className="space-y-2">
                {topCategories.map(([cat, count]) => (
                  <div key={cat} className="flex items-center gap-2">
                    <span className="text-xs w-32 flex-shrink-0">{CATEGORIES[cat]} {cat}</span>
                    <div style={{ background: C.panel2, height: 8, borderRadius: 4 }} className="flex-1 overflow-hidden"><div style={{ background: C.accent, width: `${(count / entries.length) * 100}%`, height: "100%" }} /></div>
                    <span style={{ color: C.textDim }} className="text-xs w-4 text-right">{count}</span>
                  </div>
                ))}
              </div>
            </div>
          )}
          <button onClick={generateMeInsights} disabled={meLoading} style={{ background: C.accent2, color: "#fff" }} className="w-full flex items-center justify-center gap-2 py-2.5 rounded-xl text-sm font-medium mb-3 disabled:opacity-60">
            {meLoading ? <><Loader2 size={15} className="animate-spin" /> Reading your entries…</> : <><Brain size={15} /> What I've learned about you</>}
          </button>
          {meInsights.length > 0 && (
            <div className="space-y-2 mb-4">
              {meInsights.map((ins, i) => (<div key={i} style={{ background: C.chip, color: C.text }} className="rounded-xl p-3.5 text-sm leading-relaxed">{ins}</div>))}
              <p style={{ color: C.textDim }} className="text-xs px-1">Observations from your own writing — not objective facts.</p>
            </div>
          )}
          <button onClick={generateCheckin} disabled={checkinLoading} style={{ background: C.good, color: "#173626" }} className="w-full flex items-center justify-center gap-2 py-2.5 rounded-xl text-sm font-medium mb-3 disabled:opacity-60">
            {checkinLoading ? <><Loader2 size={15} className="animate-spin" /> Reading recent entries…</> : <><Sparkles size={15} /> How have I really been?</>}
          </button>
          {checkin && (
            <div style={{ background: C.chip, color: C.text }} className="rounded-xl p-4 text-sm leading-relaxed">
              {checkin}
              <p style={{ color: C.textDim }} className="text-xs mt-3">A reflection on your own words, not a diagnosis. If things feel heavy, talking to someone you trust or a professional can help.</p>
            </div>
          )}
        </div>
      )}

      {entries.length > 0 && sub === "patterns" && (
        <div>
          <button onClick={generatePatterns} disabled={patternsLoading} style={{ background: C.accent2, color: "#fff" }} className="w-full flex items-center justify-center gap-2 py-2.5 rounded-xl text-sm font-medium mb-4 disabled:opacity-60">
            {patternsLoading ? <><Loader2 size={15} className="animate-spin" /> Looking for repetition…</> : <><Sparkles size={15} /> Find patterns</>}
          </button>
          {patterns.length === 0 && !patternsLoading && <EmptyState C={C} text="Patterns need real repetition — the more you write, the more this finds." />}
          <div className="space-y-3">
            {patterns.filter((p) => patternFeedback[p.pattern] !== "not-accurate").map((p, i) => (
              <div key={i} style={{ background: C.panel, border: `1px solid ${C.line}` }} className="rounded-xl p-4">
                <div className="flex items-center justify-between gap-2 mb-1">
                  <span style={{ background: C.chip, color: C.good }} className="text-[10px] px-2 py-0.5 rounded-full uppercase tracking-wide">{p.confidence || "Medium"} confidence</span>
                  <span style={{ color: C.textDim }} className="text-[11px]">{(p.evidence || []).length} entries</span>
                </div>
                <p className="text-sm mt-1.5">{p.pattern}</p>
                <button onClick={() => setExpandedPattern(expandedPattern === i ? null : i)} style={{ color: C.textDim }} className="flex items-center gap-1 text-xs mt-2">
                  <ChevronDown size={13} style={{ transform: expandedPattern === i ? "rotate(180deg)" : "none" }} /> Why do you think this?
                </button>
                {expandedPattern === i && (
                  <div className="mt-2 space-y-1.5">
                    {(p.evidence || []).map((e, j) => (<div key={j} style={{ background: C.chip }} className="rounded-lg p-2 text-xs"><span style={{ color: C.textDim }}>{formatLong(e.date)} — </span>{e.text.slice(0, 90)}{e.text.length > 90 ? "…" : ""}</div>))}
                  </div>
                )}
                <div className="flex gap-2 mt-3">
                  <button onClick={() => setPatternFeedback((f) => ({ ...f, [p.pattern]: "accurate" }))} style={{ background: patternFeedback[p.pattern] === "accurate" ? C.good : C.chip, color: patternFeedback[p.pattern] === "accurate" ? "#173626" : C.textDim }} className="flex items-center gap-1 text-xs px-2.5 py-1 rounded-full"><ThumbsUp size={12} /> Accurate</button>
                  <button onClick={() => setPatternFeedback((f) => ({ ...f, [p.pattern]: "not-accurate" }))} style={{ background: C.chip, color: C.textDim }} className="flex items-center gap-1 text-xs px-2.5 py-1 rounded-full"><ThumbsDown size={12} /> Not accurate</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {entries.length > 0 && sub === "contradictions" && (
        <div>
          <button onClick={generateContradictions} disabled={contradictionsLoading} style={{ background: C.accent2, color: "#fff" }} className="w-full flex items-center justify-center gap-2 py-2.5 rounded-xl text-sm font-medium mb-4 disabled:opacity-60">
            {contradictionsLoading ? <><Loader2 size={15} className="animate-spin" /> Looking for tensions…</> : <><Sparkles size={15} /> Find tensions</>}
          </button>
          {contradictions.length === 0 && !contradictionsLoading && <EmptyState C={C} text="Looks for real tensions — wanting two things at once, entries at odds with each other." />}
          <div className="space-y-3">
            {contradictions.filter((c) => contradictionFeedback[c.tension] !== "no").map((c, i) => (
              <div key={i} style={{ background: C.panel, border: `1px solid ${C.line}` }} className="rounded-xl p-4">
                <p style={{ color: C.warn }} className="text-[10px] uppercase tracking-wide mb-1">Something interesting</p>
                <p className="text-sm mb-3">{c.tension}</p>
                <div className="grid grid-cols-2 gap-2 mb-3">
                  <div style={{ background: C.chip }} className="rounded-lg p-2 text-xs"><span style={{ color: C.textDim }}>{c.dateA}</span><p className="mt-1">"{c.snippetA}"</p></div>
                  <div style={{ background: C.chip }} className="rounded-lg p-2 text-xs"><span style={{ color: C.textDim }}>{c.dateB}</span><p className="mt-1">"{c.snippetB}"</p></div>
                </div>
                <p style={{ color: C.textDim }} className="text-xs mb-2">Do these feel like they conflict to you?</p>
                <div className="flex gap-2">
                  {["Yes", "No", "Not sure"].map((opt) => (
                    <button key={opt} onClick={() => setContradictionFeedback((f) => ({ ...f, [c.tension]: opt.toLowerCase() }))} style={{ background: contradictionFeedback[c.tension] === opt.toLowerCase() ? C.accent : C.chip, color: contradictionFeedback[c.tension] === opt.toLowerCase() ? C.surfaceOnAccent : C.textDim }} className="text-xs px-2.5 py-1 rounded-full">{opt}</button>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {entries.length > 0 && sub === "beliefs" && (
        <div>
          <button onClick={generateBeliefsValues} disabled={beliefsLoading} style={{ background: C.accent2, color: "#fff" }} className="w-full flex items-center justify-center gap-2 py-2.5 rounded-xl text-sm font-medium mb-4 disabled:opacity-60">
            {beliefsLoading ? <><Loader2 size={15} className="animate-spin" /> Reading for beliefs & values…</> : <><Sparkles size={15} /> Extract beliefs & values</>}
          </button>
          {!beliefsValues && !beliefsLoading && <EmptyState C={C} text="Pulls out beliefs and values that keep showing up in your writing." />}
          {beliefsValues && (
            <div className="space-y-4">
              {beliefsValues.values?.length > 0 && (
                <div style={{ background: C.panel, border: `1px solid ${C.line}` }} className="rounded-xl p-4">
                  <p style={{ color: C.textDim }} className="text-xs mb-2">Themes that appear frequently</p>
                  <div className="flex flex-wrap gap-2">{beliefsValues.values.map((v) => (<span key={v} style={{ background: C.accent, color: C.surfaceOnAccent }} className="text-xs px-3 py-1 rounded-full font-medium">{v}</span>))}</div>
                </div>
              )}
              {beliefsValues.beliefs?.map((b, i) => (
                <div key={i} style={{ background: C.chip, color: C.text }} className="rounded-xl p-4">
                  <p className="text-sm">"{b.belief}"</p>
                  <p style={{ color: C.textDim }} className="text-xs mt-2">Seen in {b.timesSeen} {b.timesSeen === 1 ? "entry" : "entries"}</p>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {entries.length > 0 && sub === "weekly" && (
        <div>
          <button onClick={generateWeekly} disabled={weeklyLoading} style={{ background: C.accent2, color: "#fff" }} className="w-full flex items-center justify-center gap-2 py-2.5 rounded-xl text-sm font-medium mb-4 disabled:opacity-60">
            {weeklyLoading ? <><Loader2 size={15} className="animate-spin" /> Putting your week together…</> : <><Sparkles size={15} /> Generate this week's reflection</>}
          </button>
          {weekly ? (
            <div className="space-y-3">
              <InsightBlock label="What happened" text={weekly.whatHappened} C={C} />
              <InsightBlock label="What you seemed to feel" text={weekly.feelings} C={C} />
              <InsightBlock label="Something repeating" text={weekly.patterns} C={C} />
              <div style={{ background: C.accent, color: C.surfaceOnAccent }} className="rounded-xl p-4 text-sm font-medium">{weekly.question}</div>
            </div>
          ) : <EmptyState C={C} text="Generates a short reflection from whatever you've written in the last 7 days." />}
        </div>
      )}
    </div>
  );
}

/* PLAY                                                               */
/* ---------------------------------------------------------------- */

function PlayTab({ C, entries, setToast }) {
  const [sub, setSub] = useState("roast");
  const [roastLevel, setRoastLevel] = useState("Light");
  const [roast, setRoast] = useState(""); const [roastLoading, setRoastLoading] = useState(false);
  const [hype, setHype] = useState(""); const [hypeLoading, setHypeLoading] = useState(false);
  const [gameQuestion, setGameQuestion] = useState(null); const [gameAnswer, setGameAnswer] = useState(null);
  const [gameResult, setGameResult] = useState(null); const [gameLoading, setGameLoading] = useState(false);
  const [lore, setLore] = useState(null); const [loreLoading, setLoreLoading] = useState(false);

  async function generateRoast() {
    if (entries.length === 0) { setToast("Write a few entries first — nothing to roast yet."); return; }
    setRoastLoading(true); setRoast("");
    const material = entries.map((e) => `[${formatLong(e.date)}]: ${e.text}`).join("\n");
    const text = await askClaude(`You are a witty, affectionate friend gently roasting someone based on their diary entries. Roast level: ${roastLevel}. Only joke about harmless everyday patterns. NEVER joke about trauma, health, grief, or anything sensitive — if entries are only sensitive, say there's nothing harmless to roast. Under 100 words.\n\n${material}`);
    setRoast(text || "Couldn't cook up a roast this time."); setRoastLoading(false);
  }
  async function generateHype() {
    if (entries.length < 2) { setToast("A couple more entries first."); return; }
    setHypeLoading(true); setHype("");
    const sorted = [...entries].sort((a, b) => a.createdAt - b.createdAt);
    const material = sorted.map((e) => `[${formatLong(e.date)}]: ${e.text}`).join("\n");
    const text = await askClaude(`Find genuine evidence of growth comparing earlier entries to recent ones. If unclear, be honest and encouraging instead of inventing. Under 120 words, second person.\n\n${material}`);
    setHype(text || "Couldn't find the evidence right now — try again."); setHypeLoading(false);
  }
  const GAME_QUESTIONS = [
    { q: "What do you think affects your mood the most?", options: ["Relationships", "Studies/Career", "Sleep & energy", "My own thoughts"] },
    { q: "When do you think you're most productive?", options: ["Early morning", "Late night", "Right after a deadline scare", "Whenever I've had good sleep"] },
    { q: "What do you think you value most in relationships?", options: ["Honesty", "Consistency", "Independence", "Shared goals"] },
    { q: "When uncertain about something, what do you usually do?", options: ["Overthink it alone", "Talk it through with someone", "Distract myself", "Make a pros/cons list"] },
  ];
  function startGame() { const q = GAME_QUESTIONS[Math.floor(Math.random() * GAME_QUESTIONS.length)]; setGameQuestion(q); setGameAnswer(null); setGameResult(null); }
  async function submitGameAnswer(answer) {
    if (entries.length < 2) { setToast("A couple more entries first."); return; }
    setGameAnswer(answer); setGameLoading(true);
    const material = entries.map((e) => `[${formatLong(e.date)}]: ${e.text}`).join("\n");
    const raw = await askClaude(`Question: "${gameQuestion.q}" Answer given: "${answer}". Compare to what the diary actually suggests. Respond with ONLY raw JSON:
{"verdict": "You know yourself well|Interesting...|Plot twist", "explanation": "<2-3 sentences, kind, grounded>"}\n\n${material}`);
    try { setGameResult(JSON.parse(stripFence(raw))); } catch { setToast("Couldn't score that round — try again."); }
    setGameLoading(false);
  }
  async function generateLore() {
    if (entries.length < 2) { setToast("A couple more entries first."); return; }
    setLoreLoading(true); setLore(null);
    const material = entries.map((e) => `[${formatLong(e.date)}]: ${e.text}`).join("\n");
    const raw = await askClaude(`Playfully extract the "lore" of this diary. Respond with ONLY raw JSON:
{"characters": ["<recurring person/group>"], "plotlines": [{"title": "<short playful name>", "detail": "<1 sentence>"}]}
Only genuinely repeated things. Up to 4 characters, 3 plotlines.\n\n${material}`);
    try { setLore(JSON.parse(stripFence(raw))); } catch { setToast("Couldn't put the lore together — try again."); }
    setLoreLoading(false);
  }

  const SUBS = [["roast", "Roast Me"], ["hype", "Hype Me Up"], ["game", "Know Yourself"], ["lore", "My Lore"]];

  return (
    <div>
      <p style={{ fontFamily: fonts.display, fontWeight: 600 }} className="text-2xl mb-4">Play</p>
      <div className="flex gap-2 mb-5 overflow-x-auto pb-1">
        {SUBS.map(([id, label]) => (<button key={id} onClick={() => setSub(id)} className="px-3 py-1.5 rounded-full text-xs whitespace-nowrap" style={{ background: sub === id ? C.warn : C.panel, color: sub === id ? "#fff" : C.textDim, border: `1px solid ${sub === id ? C.warn : C.line}` }}>{label}</button>))}
      </div>

      {sub === "roast" && (
        <div>
          <div className="flex gap-2 mb-4">{["Light", "Medium", "Brutal"].map((lvl) => (<button key={lvl} onClick={() => setRoastLevel(lvl)} className="flex-1 py-1.5 rounded-lg text-xs" style={{ background: roastLevel === lvl ? C.warn : C.panel, color: roastLevel === lvl ? "#fff" : C.textDim, border: `1px solid ${roastLevel === lvl ? C.warn : C.line}` }}>{lvl}</button>))}</div>
          <button onClick={generateRoast} disabled={roastLoading} style={{ background: C.warn, color: "#fff" }} className="w-full flex items-center justify-center gap-2 py-2.5 rounded-xl text-sm font-medium mb-4 disabled:opacity-60">{roastLoading ? <><Loader2 size={15} className="animate-spin" /> Warming up…</> : <><Flame size={15} /> Roast my diary</>}</button>
          {roast ? <div style={{ background: C.chip, color: C.text }} className="rounded-xl p-4 text-sm leading-relaxed">{roast}</div> : <EmptyState C={C} text="Only roasts harmless, everyday patterns — never anything sensitive." />}
        </div>
      )}
      {sub === "hype" && (
        <div>
          <button onClick={generateHype} disabled={hypeLoading} style={{ background: C.good, color: "#173626" }} className="w-full flex items-center justify-center gap-2 py-2.5 rounded-xl text-sm font-medium mb-4 disabled:opacity-60">{hypeLoading ? <><Loader2 size={15} className="animate-spin" /> Digging through your history…</> : <><Heart size={15} /> Prove I'm doing better than I think</>}</button>
          {hype ? <div style={{ background: C.chip, color: C.text }} className="rounded-xl p-4 text-sm leading-relaxed">{hype}</div> : <EmptyState C={C} text="Finds real evidence of growth by comparing earlier entries to recent ones." />}
        </div>
      )}
      {sub === "game" && (
        <div>
          {!gameQuestion && (<button onClick={startGame} style={{ background: C.accent, color: C.surfaceOnAccent }} className="w-full flex items-center justify-center gap-2 py-2.5 rounded-xl text-sm font-medium"><Sparkles size={15} /> Do you actually know yourself?</button>)}
          {gameQuestion && (
            <div style={{ background: C.panel, border: `1px solid ${C.line}` }} className="rounded-xl p-4">
              <p className="text-sm mb-3">{gameQuestion.q}</p>
              {!gameResult ? (
                <div className="space-y-2">
                  {gameQuestion.options.map((opt) => (<button key={opt} onClick={() => submitGameAnswer(opt)} disabled={gameLoading} style={{ background: gameAnswer === opt ? C.accent : C.chip, color: gameAnswer === opt ? C.surfaceOnAccent : C.text }} className="w-full text-left text-sm px-3 py-2 rounded-lg disabled:opacity-60">{opt}</button>))}
                  {gameLoading && <p style={{ color: C.textDim }} className="text-xs flex items-center gap-2 mt-2"><Loader2 size={13} className="animate-spin" /> Checking against your journal…</p>}
                </div>
              ) : (
                <div>
                  <p style={{ color: C.accent }} className="text-sm font-medium mb-2">{gameResult.verdict}</p>
                  <p className="text-sm leading-relaxed mb-4">{gameResult.explanation}</p>
                  <button onClick={startGame} style={{ background: C.chip, color: C.text }} className="text-xs px-3 py-1.5 rounded-full">Next question</button>
                </div>
              )}
            </div>
          )}
        </div>
      )}
      {sub === "lore" && (
        <div>
          <button onClick={generateLore} disabled={loreLoading} style={{ background: C.accent2, color: "#fff" }} className="w-full flex items-center justify-center gap-2 py-2.5 rounded-xl text-sm font-medium mb-4 disabled:opacity-60">{loreLoading ? <><Loader2 size={15} className="animate-spin" /> Piecing together the lore…</> : <><Users size={15} /> Show my lore</>}</button>
          {lore ? (
            <div className="space-y-4">
              {lore.characters?.length > 0 && (<div><p style={{ color: C.textDim }} className="text-xs mb-2">Characters</p><div className="flex flex-wrap gap-2">{lore.characters.map((c) => (<span key={c} style={{ background: C.panel, border: `1px solid ${C.line}` }} className="text-xs px-3 py-1.5 rounded-full">👤 {c}</span>))}</div></div>)}
              {lore.plotlines?.length > 0 && (<div><p style={{ color: C.textDim }} className="text-xs mb-2">Recurring plotlines</p><div className="space-y-2">{lore.plotlines.map((p, i) => (<div key={i} style={{ background: C.chip, color: C.text }} className="rounded-xl p-3.5"><p className="text-sm font-medium">{p.title}</p><p className="text-xs mt-1" style={{ color: C.textDim }}>{p.detail}</p></div>))}</div></div>)}
            </div>
          ) : <EmptyState C={C} text="Pulls out recurring people and ongoing storylines — a fun recap of your own life." />}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------- */
/* CAPSULE — write a note, lock it for a future date, background     */
/* configurable from Settings                                        */
/* ---------------------------------------------------------------- */

function CapsuleTab({ C, capsules, persistCapsules, setToast, bgId, keepUnlocked }) {
  const [text, setText] = useState("");
  const [unlockDate, setUnlockDate] = useState("");
  const bg = CAPSULE_BACKGROUNDS.find((b) => b.id === bgId) || CAPSULE_BACKGROUNDS[0];
  const now = Date.now();

  async function seal() {
    if (!text.trim()) { setToast("Write something to seal first."); return; }
    if (!unlockDate) { setToast("Pick a date to unlock this on."); return; }
    const unlockAt = new Date(unlockDate + "T00:00:00").getTime();
    if (unlockAt <= now) { setToast("Pick a date in the future."); return; }
    const capsule = { id: `${Date.now()}-${Math.random().toString(36).slice(2, 6)}`, text: text.trim(), createdAt: now, unlockAt, opened: false };
    await persistCapsules([capsule, ...capsules]);
    setText(""); setUnlockDate("");
    setToast("Sealed — it'll unlock on its date.");
  }
  async function openCapsule(id) {
    const next = capsules.map((c) => (c.id === id ? { ...c, opened: true } : c));
    await persistCapsules(next);
  }
  async function dismissCapsule(id) {
    await persistCapsules(capsules.filter((c) => c.id !== id));
  }

  const locked = capsules.filter((c) => c.unlockAt > now);
  const ready = capsules.filter((c) => c.unlockAt <= now && !c.opened);
  const opened = capsules.filter((c) => c.unlockAt <= now && c.opened);

  return (
    <div>
      <p style={{ fontFamily: fonts.display, fontWeight: 600 }} className="text-2xl mb-1">Time Capsule</p>
      <p style={{ color: C.textDim }} className="text-xs mb-5">Write something for future-you. It stays sealed until its date.</p>

      <div style={{ background: bg.css, border: `1px solid ${C.line}` }} className="rounded-2xl p-5 mb-5">
        <textarea value={text} onChange={(e) => setText(e.target.value)} placeholder="Dear future me…" rows={5}
          style={{ background: "rgba(255,255,255,0.06)", color: "#F3EFE9" }} className="w-full rounded-xl p-4 text-sm leading-relaxed outline-none resize-none placeholder-white/40" />
        <div className="flex items-center gap-2 mt-3">
          <input type="date" value={unlockDate} onChange={(e) => setUnlockDate(e.target.value)} style={{ background: "rgba(255,255,255,0.08)", color: "#F3EFE9" }} className="flex-1 rounded-lg px-3 py-2 text-sm outline-none" />
          <button onClick={seal} style={{ background: C.accent, color: C.surfaceOnAccent }} className="flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-medium"><Lock size={14} /> Seal</button>
        </div>
      </div>

      {ready.length > 0 && (
        <div className="mb-5">
          <p style={{ color: C.accent }} className="text-xs uppercase tracking-wide mb-2">Ready to open</p>
          <div className="space-y-2">
            {ready.map((c) => (
              <button key={c.id} onClick={() => openCapsule(c.id)} style={{ background: C.panel, border: `1px solid ${C.accent}` }} className="w-full text-left rounded-xl p-4 flex items-center justify-between">
                <span className="text-sm">Sealed {formatLong(new Date(c.createdAt).toISOString().slice(0, 10))} — tap to open</span>
                <Unlock size={16} color={C.accent} />
              </button>
            ))}
          </div>
        </div>
      )}

      {opened.length > 0 && (
        <div className="mb-5">
          <p style={{ color: C.textDim }} className="text-xs uppercase tracking-wide mb-2">Opened</p>
          <div className="space-y-2">
            {opened.map((c) => (
              <div key={c.id} style={{ background: C.chip, color: C.text }} className="rounded-xl p-4">
                <p className="text-sm leading-relaxed">{c.text}</p>
                <div className="flex items-center justify-between mt-2">
                  <p style={{ color: C.textDim }} className="text-[11px]">Written {formatLong(new Date(c.createdAt).toISOString().slice(0, 10))}</p>
                  {!keepUnlocked && <button onClick={() => dismissCapsule(c.id)} style={{ color: C.textDim }} className="text-[11px] flex items-center gap-1"><Trash2 size={11} /> Let go</button>}
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      <div>
        <p style={{ color: C.textDim }} className="text-xs uppercase tracking-wide mb-2">Still sealed</p>
        {locked.length === 0 ? (
          <EmptyState C={C} text="Nothing waiting right now — write one above." />
        ) : (
          <div className="space-y-2">
            {locked.map((c) => (
              <div key={c.id} style={{ background: C.panel, border: `1px dashed ${C.line}` }} className="rounded-xl p-4 flex items-center gap-3">
                <Lock size={16} color={C.textDim} />
                <div className="flex-1">
                  <p style={{ color: C.textDim }} className="text-xs">Unlocks {formatLong(new Date(c.unlockAt).toISOString().slice(0, 10))}</p>
                </div>
                <Timer size={14} color={C.textDim} />
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

/* SETTINGS                                                           */

function SettingsTab({ C, themeId, onTheme, capsuleBg, onCapsuleBg, keepUnlocked, onKeepUnlocked, userEmail, onLogout, db, uid }) {
  const userDocRef = useMemo(() => db.collection("users").doc(uid), [db, uid]);
  const [lockEnabled, setLockEnabled] = useState(false);
  const [showPinForm, setShowPinForm] = useState(false);
  const [p1, setP1] = useState("");
  const [p2, setP2] = useState("");
  const [lockMsg, setLockMsg] = useState("");

  useEffect(() => {
    (async () => {
      const snap = await userDocRef.get();
      const lock = snap.exists ? snap.data().lock : null;
      setLockEnabled(!!(lock && lock.enabled));
    })();
  }, [userDocRef]);

  async function savePin(e) {
    e.preventDefault();
    setLockMsg("");
    if (!/^\d{4,6}$/.test(p1)) { setLockMsg("PIN should be 4-6 digits."); return; }
    if (p1 !== p2) { setLockMsg("PINs don't match."); return; }
    const h = await hashPin(p1);
    await userDocRef.set({ lock: { enabled: true, pinHash: h } }, { merge: true });
    setLockEnabled(true); setShowPinForm(false); setP1(""); setP2("");
    setLockMsg("App lock is on.");
  }
  async function turnOffLock() {
    await userDocRef.set({ lock: { enabled: false } }, { merge: true });
    setLockEnabled(false);
    setLockMsg("App lock is off.");
  }

  return (
    <div>
      <p style={{ fontFamily: fonts.display, fontWeight: 600 }} className="text-2xl mb-5">Settings</p>

      <div style={{ background: C.panel, border: `1px solid ${C.line}` }} className="rounded-2xl p-4 mb-4 flex items-center justify-between">
        <div>
          <p style={{ color: C.textDim }} className="text-xs mb-0.5">Signed in as</p>
          <p className="text-sm">{userEmail}</p>
        </div>
        <button onClick={onLogout} style={{ background: C.panel2, color: C.text }} className="text-xs px-3 py-1.5 rounded-full">Log out</button>
      </div>

      <div style={{ background: C.panel, border: `1px solid ${C.line}` }} className="rounded-2xl p-4 mb-4">
        <div className="flex items-center justify-between">
          <div>
            <p className="text-sm flex items-center gap-1.5"><Lock size={13} /> App lock</p>
            <p style={{ color: C.textDim }} className="text-[11px] mt-0.5">Ask for a PIN every time the app opens. If you forget it, a code goes to {userEmail}.</p>
          </div>
          {lockEnabled ? (
            <button onClick={turnOffLock} style={{ background: C.panel2, color: C.text }} className="text-xs px-3 py-1.5 rounded-full flex-shrink-0">Turn off</button>
          ) : (
            <button onClick={() => setShowPinForm(true)} style={{ background: C.accent, color: C.surfaceOnAccent }} className="text-xs px-3 py-1.5 rounded-full flex-shrink-0">Set up</button>
          )}
        </div>
        {lockEnabled && !showPinForm && (
          <button onClick={() => setShowPinForm(true)} style={{ color: C.textDim }} className="text-xs mt-3">Change PIN</button>
        )}
        {showPinForm && (
          <form onSubmit={savePin} className="mt-3 space-y-2">
            <input type="password" inputMode="numeric" value={p1} onChange={(e) => setP1(e.target.value)} placeholder="New PIN (4-6 digits)" maxLength={6}
              style={{ background: C.panel2, color: C.text }} className="w-full rounded-lg px-3 py-2 text-sm outline-none" />
            <input type="password" inputMode="numeric" value={p2} onChange={(e) => setP2(e.target.value)} placeholder="Confirm PIN" maxLength={6}
              style={{ background: C.panel2, color: C.text }} className="w-full rounded-lg px-3 py-2 text-sm outline-none" />
            <button type="submit" style={{ background: C.accent, color: C.surfaceOnAccent }} className="w-full py-2 rounded-lg text-sm font-medium">Save PIN</button>
          </form>
        )}
        {lockMsg && <p style={{ color: C.textDim }} className="text-xs mt-2">{lockMsg}</p>}
      </div>

      <div style={{ background: C.panel, border: `1px solid ${C.line}` }} className="rounded-2xl p-4 mb-4">
        <p style={{ color: C.textDim }} className="text-xs mb-3">Theme</p>
        <div className="grid grid-cols-3 gap-3">
          {Object.entries(THEMES).map(([id, t]) => (
            <button key={id} onClick={() => onTheme(id)} className="rounded-xl p-3 text-left relative" style={{ background: t.bg, border: `2px solid ${themeId === id ? t.accent : "transparent"}` }}>
              {themeId === id && (<div style={{ background: t.accent, color: t.surfaceOnAccent }} className="absolute top-2 right-2 rounded-full p-0.5"><Check size={11} /></div>)}
              <div className="flex gap-1 mb-2">
                <span style={{ background: t.accent, width: 12, height: 12, borderRadius: 6, display: "inline-block" }} />
                <span style={{ background: t.accent2, width: 12, height: 12, borderRadius: 6, display: "inline-block" }} />
              </div>
              <p style={{ color: t.text, fontFamily: fonts.display, fontWeight: 600 }} className="text-sm">{t.name}</p>
            </button>
          ))}
        </div>
        <p style={{ color: C.textDim }} className="text-[11px] mt-3">The typeface stays the same across every theme — only the palette changes.</p>
      </div>

      <div style={{ background: C.panel, border: `1px solid ${C.line}` }} className="rounded-2xl p-4 mb-4">
        <p style={{ color: C.textDim }} className="text-xs mb-3 flex items-center gap-1.5"><ImageIcon size={12} /> Capsule background</p>
        <div className="grid grid-cols-4 gap-2">
          {CAPSULE_BACKGROUNDS.map((b) => (
            <button key={b.id} onClick={() => onCapsuleBg(b.id)} className="rounded-lg h-14 relative" style={{ background: b.css, border: `2px solid ${capsuleBg === b.id ? C.accent : "transparent"}` }}>
              {capsuleBg === b.id && (<div style={{ background: C.accent, color: C.surfaceOnAccent }} className="absolute top-1 right-1 rounded-full p-0.5"><Check size={10} /></div>)}
              <span className="absolute bottom-1 left-1.5 text-[9px] text-white/80">{b.label}</span>
            </button>
          ))}
        </div>
      </div>

      <div style={{ background: C.panel, border: `1px solid ${C.line}` }} className="rounded-2xl p-4 mb-4">
        <div className="flex items-center justify-between">
          <div>
            <p className="text-sm">Keep opened capsules</p>
            <p style={{ color: C.textDim }} className="text-[11px] mt-0.5">Off lets you let go of a capsule right after reading it.</p>
          </div>
          <button onClick={() => onKeepUnlocked(!keepUnlocked)} className="w-11 h-6 rounded-full relative flex-shrink-0" style={{ background: keepUnlocked ? C.accent : C.panel2 }}>
            <span className="absolute top-0.5 rounded-full bg-white transition-all" style={{ width: 20, height: 20, left: keepUnlocked ? 22 : 2 }} />
          </button>
        </div>
      </div>

      <p style={{ color: C.textDim }} className="text-xs text-center px-4 mt-6">
        Your entries and capsules are saved to your account, not just this device.
      </p>
    </div>
  );
}

/* ---------------------------------------------------------------- */
/* AUTH — sign up, log in, forgot password. Uses Firebase Auth so    */
/* password hashing, sessions, and reset emails are handled for us.  */
/* ---------------------------------------------------------------- */

const AUTH_THEME = THEMES.pink;

function AuthGate({ auth, onLoggedIn }) {
  const C = AUTH_THEME;
  const [mode, setMode] = useState("login"); // login | signup | reset
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [notice, setNotice] = useState("");

  function friendlyError(code) {
    const map = {
      "auth/invalid-email": "That email doesn't look right.",
      "auth/user-not-found": "No account with that email — try signing up instead.",
      "auth/wrong-password": "Wrong password — try again or reset it.",
      "auth/email-already-in-use": "An account already exists with this email — try logging in.",
      "auth/weak-password": "Use at least 6 characters for your password.",
      "auth/too-many-requests": "Too many attempts — wait a bit and try again.",
    };
    return map[code] || "Something went wrong — try again.";
  }

  async function submit(e) {
    e.preventDefault();
    setError(""); setNotice(""); setLoading(true);
    try {
      if (mode === "signup") {
        await auth.createUserWithEmailAndPassword(email.trim(), password);
      } else if (mode === "login") {
        await auth.signInWithEmailAndPassword(email.trim(), password);
      } else if (mode === "reset") {
        await auth.sendPasswordResetEmail(email.trim());
        setNotice("Reset link sent — check your inbox (and spam folder).");
      }
    } catch (err) {
      setError(friendlyError(err.code));
    }
    setLoading(false);
  }

  return (
    <div style={{ background: C.bg, minHeight: "100vh", color: C.text, fontFamily: fonts.body }} className="w-full flex items-center justify-center px-5">
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Quicksand:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=swap');`}</style>
      <div className="w-full max-w-sm">
        <div className="text-center mb-6">
          <p style={{ fontFamily: fonts.display, fontStyle: "italic", fontWeight: 600, color: C.accent }} className="text-3xl">Postmark</p>
          <p style={{ fontFamily: fonts.script, color: C.accent2 }} className="text-lg">every day, sealed and kept</p>
        </div>

        <div style={{ background: C.panel, border: `1px solid ${C.line}` }} className="rounded-2xl p-5">
          <div className="flex gap-2 mb-4">
            {[["login", "Log in"], ["signup", "Sign up"]].map(([id, label]) => (
              <button key={id} type="button" onClick={() => { setMode(id); setError(""); setNotice(""); }}
                className="flex-1 py-2 rounded-lg text-sm font-medium"
                style={{ background: mode === id ? C.accent : C.panel2, color: mode === id ? C.surfaceOnAccent : C.textDim }}>
                {label}
              </button>
            ))}
          </div>

          {mode === "reset" && (
            <p style={{ color: C.textDim }} className="text-xs mb-3">Enter your email and we'll send a link to reset your password.</p>
          )}

          <form onSubmit={submit}>
            <label style={{ color: C.textDim }} className="text-xs block mb-1">Email</label>
            <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)}
              style={{ background: C.panel2, color: C.text }} className="w-full rounded-lg px-3 py-2 text-sm outline-none mb-3" placeholder="you@example.com" />

            {mode !== "reset" && (
              <>
                <label style={{ color: C.textDim }} className="text-xs block mb-1">Password</label>
                <input type="password" required minLength={6} value={password} onChange={(e) => setPassword(e.target.value)}
                  style={{ background: C.panel2, color: C.text }} className="w-full rounded-lg px-3 py-2 text-sm outline-none mb-3" placeholder="At least 6 characters" />
              </>
            )}

            {error && <p style={{ color: C.warn }} className="text-xs mb-3">{error}</p>}
            {notice && <p style={{ color: C.good }} className="text-xs mb-3">{notice}</p>}

            <button type="submit" disabled={loading} style={{ background: C.accent, color: C.surfaceOnAccent }} className="w-full py-2.5 rounded-lg text-sm font-medium disabled:opacity-60">
              {loading ? "Please wait…" : mode === "login" ? "Log in" : mode === "signup" ? "Create account" : "Send reset link"}
            </button>
          </form>

          {mode !== "reset" ? (
            <button onClick={() => { setMode("reset"); setError(""); setNotice(""); }} style={{ color: C.textDim }} className="w-full text-center text-xs mt-3">Forgot password?</button>
          ) : (
            <button onClick={() => { setMode("login"); setError(""); setNotice(""); }} style={{ color: C.textDim }} className="w-full text-center text-xs mt-3">Back to log in</button>
          )}
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------- */
/* APP LOCK — a PIN on top of the account login, for privacy on a    */
/* shared device. Forgot-PIN sends a one-time code to the account's  */
/* own email (via our Netlify function), never anyone else's.        */
/* ---------------------------------------------------------------- */

async function hashPin(pin) {
  const enc = new TextEncoder().encode(pin);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
}
function genOtp() {
  return String(Math.floor(100000 + Math.random() * 900000));
}
async function sendOtpEmail(to, code) {
  try {
    const res = await fetch("/.netlify/functions/send-otp", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ to, code }),
    });
    return res.ok;
  } catch { return false; }
}

function AppLock({ db, uid, userEmail, onUnlocked }) {
  const C = AUTH_THEME;
  const userDocRef = useMemo(() => db.collection("users").doc(uid), [db, uid]);
  const [stage, setStage] = useState("checking"); // checking | enter | forgot-sent | forgot-verify | reset
  const [pinHash, setPinHash] = useState(null);
  const [pin, setPin] = useState("");
  const [error, setError] = useState("");
  const [otpInput, setOtpInput] = useState("");
  const [otpRecord, setOtpRecord] = useState(null); // { code, expiresAt }
  const [newPin, setNewPin] = useState("");
  const [newPin2, setNewPin2] = useState("");
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    (async () => {
      const snap = await userDocRef.get();
      const lock = snap.exists ? snap.data().lock : null;
      if (lock && lock.enabled && lock.pinHash) { setPinHash(lock.pinHash); setStage("enter"); }
      else onUnlocked();
    })();
  }, [userDocRef]);

  async function submitPin(e) {
    e.preventDefault();
    setError("");
    const h = await hashPin(pin);
    if (h === pinHash) onUnlocked();
    else { setError("Wrong PIN — try again."); setPin(""); }
  }

  async function requestOtp() {
    setBusy(true); setError("");
    const code = genOtp();
    const expiresAt = Date.now() + 10 * 60 * 1000; // 10 minutes
    await userDocRef.set({ lockOtp: { code, expiresAt } }, { merge: true });
    setOtpRecord({ code, expiresAt });
    const ok = await sendOtpEmail(userEmail, code);
    setBusy(false);
    if (ok) setStage("forgot-verify");
    else setError("Couldn't send the email right now — try again in a moment.");
  }

  async function verifyOtp(e) {
    e.preventDefault();
    setError("");
    const snap = await userDocRef.get();
    const rec = snap.exists ? snap.data().lockOtp : null;
    if (!rec || rec.code !== otpInput.trim() || Date.now() > rec.expiresAt) {
      setError("That code's wrong or expired — request a new one.");
      return;
    }
    setStage("reset");
  }

  async function saveNewPin(e) {
    e.preventDefault();
    setError("");
    if (!/^\d{4,6}$/.test(newPin)) { setError("PIN should be 4-6 digits."); return; }
    if (newPin !== newPin2) { setError("PINs don't match."); return; }
    const h = await hashPin(newPin);
    await userDocRef.set({ lock: { enabled: true, pinHash: h }, lockOtp: firebase.firestore.FieldValue.delete() }, { merge: true });
    onUnlocked();
  }

  if (stage === "checking") {
    return <div style={{ background: C.bg, minHeight: "100vh" }} className="w-full flex items-center justify-center"><p style={{ color: C.textDim }} className="text-sm">Loading…</p></div>;
  }

  return (
    <div style={{ background: C.bg, minHeight: "100vh", color: C.text, fontFamily: fonts.body }} className="w-full flex items-center justify-center px-5">
      <div className="w-full max-w-sm">
        <div className="text-center mb-6">
          <IconGlyph glyph="🔒" size={30} color={C.accent} />
          <p style={{ fontFamily: fonts.display, fontWeight: 600 }} className="text-xl mt-2">Postmark is locked</p>
        </div>

        <div style={{ background: C.panel, border: `1px solid ${C.line}` }} className="rounded-2xl p-5">
          {stage === "enter" && (
            <form onSubmit={submitPin}>
              <input type="password" inputMode="numeric" autoFocus value={pin} onChange={(e) => setPin(e.target.value)}
                style={{ background: C.panel2, color: C.text, letterSpacing: 6 }} className="w-full rounded-lg px-3 py-2.5 text-center text-lg outline-none mb-3" placeholder="••••" maxLength={6} />
              {error && <p style={{ color: C.warn }} className="text-xs mb-3 text-center">{error}</p>}
              <button type="submit" style={{ background: C.accent, color: C.surfaceOnAccent }} className="w-full py-2.5 rounded-lg text-sm font-medium">Unlock</button>
              <button type="button" onClick={requestOtp} disabled={busy} style={{ color: C.textDim }} className="w-full text-center text-xs mt-3 disabled:opacity-60">
                {busy ? "Sending code…" : "Forgot PIN?"}
              </button>
            </form>
          )}

          {stage === "forgot-verify" && (
            <form onSubmit={verifyOtp}>
              <p style={{ color: C.textDim }} className="text-xs mb-3">Sent a 6-digit code to {userEmail}. Enter it below.</p>
              <input type="text" inputMode="numeric" autoFocus value={otpInput} onChange={(e) => setOtpInput(e.target.value)}
                style={{ background: C.panel2, color: C.text, letterSpacing: 6 }} className="w-full rounded-lg px-3 py-2.5 text-center text-lg outline-none mb-3" placeholder="000000" maxLength={6} />
              {error && <p style={{ color: C.warn }} className="text-xs mb-3 text-center">{error}</p>}
              <button type="submit" style={{ background: C.accent, color: C.surfaceOnAccent }} className="w-full py-2.5 rounded-lg text-sm font-medium">Verify code</button>
              <button type="button" onClick={requestOtp} disabled={busy} style={{ color: C.textDim }} className="w-full text-center text-xs mt-3 disabled:opacity-60">Resend code</button>
            </form>
          )}

          {stage === "reset" && (
            <form onSubmit={saveNewPin}>
              <p style={{ color: C.textDim }} className="text-xs mb-3">Set a new PIN.</p>
              <input type="password" inputMode="numeric" autoFocus value={newPin} onChange={(e) => setNewPin(e.target.value)}
                style={{ background: C.panel2, color: C.text, letterSpacing: 6 }} className="w-full rounded-lg px-3 py-2.5 text-center text-lg outline-none mb-3" placeholder="New PIN" maxLength={6} />
              <input type="password" inputMode="numeric" value={newPin2} onChange={(e) => setNewPin2(e.target.value)}
                style={{ background: C.panel2, color: C.text, letterSpacing: 6 }} className="w-full rounded-lg px-3 py-2.5 text-center text-lg outline-none mb-3" placeholder="Confirm PIN" maxLength={6} />
              {error && <p style={{ color: C.warn }} className="text-xs mb-3 text-center">{error}</p>}
              <button type="submit" style={{ background: C.accent, color: C.surfaceOnAccent }} className="w-full py-2.5 rounded-lg text-sm font-medium">Save & unlock</button>
            </form>
          )}
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------- */
/* ROOT — watches Firebase auth state and swaps between AuthGate and */
/* the main app.                                                     */
/* ---------------------------------------------------------------- */

function Root() {
  const [user, setUser] = useState(undefined); // undefined = checking, null = logged out
  const [unlocked, setUnlocked] = useState(false);
  const auth = useMemo(() => firebase.auth(), []);
  const db = useMemo(() => firebase.firestore(), []);

  useEffect(() => {
    const unsub = auth.onAuthStateChanged((u) => { setUser(u || null); setUnlocked(false); });
    return unsub;
  }, [auth]);

  if (user === undefined) {
    return (
      <div style={{ background: THEMES.pink.bg, minHeight: "100vh" }} className="w-full flex items-center justify-center">
        <p style={{ color: THEMES.pink.textDim, fontFamily: fonts.body }} className="text-sm">Loading…</p>
      </div>
    );
  }
  if (!user) {
    return <AuthGate auth={auth} onLoggedIn={() => {}} />;
  }
  if (!unlocked) {
    return <AppLock db={db} uid={user.uid} userEmail={user.email} onUnlocked={() => setUnlocked(true)} />;
  }
  return <PostmarkApp uid={user.uid} db={db} userEmail={user.email} onLogout={() => auth.signOut()} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);

</script>
